name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      AI_PROVIDER: mock
      COPILOT_SDK_LIVE_TEST: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and verification tools
        run: python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest -q --junitxml=test-results.xml

      - name: Audit installed dependencies
        run: python -m pip_audit --skip-editable

      - name: Build wheel
        run: python -m build --wheel

      - name: Upload test and package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-python-${{ matrix.python-version }}
          path: |
            test-results.xml
            dist/*.whl
          if-no-files-found: ignore